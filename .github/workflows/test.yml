name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Create venv + install deps
        run: |
          uv venv --python 3.13
          uv pip install -e .
          uv pip install pytest

      - name: Run pytest
        env:
          # Force CPU on CI (no GPU available)
          CUDA_VISIBLE_DEVICES: ""
          PYTORCH_ENABLE_MPS_FALLBACK: "1"
        run: |
          .venv/bin/python -m pytest tests/ -v --tb=short

      - name: CLI smoke test
        run: |
          .venv/bin/python -m backend.cli system lorenz --analyses dna --out /tmp/lorenz.json
          test -f /tmp/lorenz.json
          .venv/bin/python -c "import json; d = json.load(open('/tmp/lorenz.json')); assert 'dna' in d['analyses']; print('CLI OK · DNA score:', d['analyses']['dna']['composite_score'])"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check backend/ tests/ --select=E,F,W --ignore=E501,F401,F403,E731,F841,E702,E741
