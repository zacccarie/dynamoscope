[project]
name = "dynamoscope"
version = "0.1.0"
description = "Video dynamics + emergence research tool"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "torch>=2.5",
    "torchvision>=0.20",
    "umap-learn>=0.5.7",
    "opencv-python>=4.10",
    "numpy>=1.26,<2.2",
    "pillow>=11",
    "scikit-learn>=1.5",
    "pywavelets>=1.9",
]

[tool.setuptools]
packages = ["backend"]
